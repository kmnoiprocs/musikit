<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="An interactive guide and cheat sheet for beatmakers, songwriters, vocalists, and engineers." />
    <title>MusiKit: The Music Production Guide</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('musikit:theme'))
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
